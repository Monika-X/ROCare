<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCare | Create Account</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/redesign.css">
</head>
<body>
    <div style="position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 1000;">
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle color theme"><i class="ri-moon-line"></i></button>
        <button id="dir-toggle" class="icon-btn dir-text-btn" aria-label="Toggle text direction">LTR</button>
    </div>

    <main class="auth-arena">
        <div class="auth-card">
            <div class="auth-header">
                <a href="../index.html" class="auth-logo">
                    <img src="../assets/logo.png" alt="ROCare Logo">
                    <span>ROCare</span>
                </a>
                <h1>Create Account</h1>
                <p>Join ROCare for premium water services</p>
            </div>

            <form action="../index.html" method="GET">
                <div class="auth-form-group">
                    <label>Full Name</label>
                    <div class="auth-input-wrapper">
                        <input type="text" class="auth-input" placeholder="Your full name" required>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label>Email Address</label>
                    <div class="auth-input-wrapper">
                        <input type="email" class="auth-input" placeholder="user@example.com" required>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label>Phone Number</label>
                    <div class="auth-input-wrapper">
                        <input type="tel" class="auth-input" placeholder="+91 98765 43210" required>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label>Password</label>
                    <div class="auth-input-wrapper">
                        <input type="password" class="auth-input" placeholder="Create a strong password" required>
                        <i class="ri-eye-off-line auth-input-icon"></i>
                    </div>
                </div>

                <div class="auth-form-group" style="margin-bottom: 24px;">
                    <label>Confirm Password</label>
                    <div class="auth-input-wrapper">
                        <input type="password" class="auth-input" placeholder="Re-enter your password" required>
                        <i class="ri-eye-off-line auth-input-icon"></i>
                    </div>
                </div>

                <div class="auth-options" style="margin-bottom: 24px;">
                    <label class="auth-checkbox">
                        <input type="checkbox" required> 
                        <span style="font-size: 0.8rem;">I agree to the <a href="terms-conditions.html" class="auth-link">Terms of Service</a> and <a href="privacy-policy.html" class="auth-link">Privacy Policy</a></span>
                    </label>
                </div>

                <button type="submit" class="auth-btn">Create Account</button>
            </form>

            <div class="auth-divider">or sign up with</div>

            <div class="social-login-grid">
                <a href="../index.html" class="social-btn">
                    <i class="ri-google-fill" style="color: #DB4437; font-size: 1.2rem;"></i> Google
                </a>
                <a href="../index.html" class="social-btn">
                    <i class="ri-facebook-circle-fill" style="color: #4267B2; font-size: 1.2rem;"></i> Facebook
                </a>
            </div>

            <div class="auth-footer">
                Already have an account? <a href="login.html" class="auth-link">Sign In</a>
            </div>
        </div>
    </main>

    <script src="../js/main.js"></script>
</body>
</html>
